<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玄学分析入口舱</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-0: oklch(0.1 0.01 250);
        --bg-1: oklch(0.14 0.015 250);
        --bg-2: oklch(0.18 0.018 250);
        --panel: rgba(15, 20, 33, 0.9);
        --panel-soft: rgba(19, 24, 38, 0.78);
        --line: rgba(154, 172, 219, 0.18);
        --line-strong: rgba(154, 172, 219, 0.28);
        --text: rgba(243, 246, 255, 0.96);
        --text-soft: rgba(178, 188, 220, 0.82);
        --text-faint: rgba(129, 141, 176, 0.66);
        --accent: oklch(0.75 0.07 220);
        --accent-soft: rgba(109, 150, 255, 0.14);
        --accent-gold: oklch(0.74 0.08 88);
        --radius-sm: 14px;
        --radius-md: 22px;
        --radius-lg: 34px;
        --radius-pill: 999px;
        --shadow-0: 0 34px 90px rgba(0, 0, 0, 0.42);
        --shadow-1: 0 14px 40px rgba(0, 0, 0, 0.24);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 18%, rgba(86, 131, 255, 0.16), transparent 22%),
          radial-gradient(circle at 84% 14%, rgba(90, 199, 255, 0.08), transparent 20%),
          radial-gradient(circle at 50% 110%, rgba(255, 196, 111, 0.08), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 28%),
          linear-gradient(180deg, var(--bg-1), var(--bg-0));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 120px 120px;
        mask-image: radial-gradient(circle at center, black, transparent 82%);
        opacity: 0.28;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 0;
        background: none;
        color: inherit;
      }

      .entry-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .entry-card {
        position: relative;
        width: min(960px, 100%);
        padding: 32px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(18, 24, 38, 0.96), rgba(12, 16, 27, 0.98));
        box-shadow: var(--shadow-0);
        overflow: hidden;
      }

      .entry-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top left, rgba(126, 166, 255, 0.16), transparent 28%),
          linear-gradient(120deg, transparent 35%, rgba(255, 255, 255, 0.02) 50%, transparent 65%);
        pointer-events: none;
      }

      .entry-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 34px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-family: "Baskerville", "Times New Roman", "Songti SC", "Source Han Serif SC", serif;
        font-size: 20px;
        font-weight: 700;
        color: rgba(247, 250, 255, 0.96);
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.24), transparent 36%),
          linear-gradient(145deg, rgba(82, 124, 232, 0.98), rgba(34, 71, 162, 0.98));
        box-shadow: 0 16px 34px rgba(23, 53, 131, 0.34);
      }

      .brand-copy strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-copy span,
      .signal-strip span,
      .field-note,
      .entry-copy p,
      .entry-footer {
        color: var(--text-soft);
      }

      .signal-strip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 14px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--line);
        background: rgba(19, 25, 40, 0.86);
        font-size: 13px;
      }

      .signal-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(109, 150, 255, 0.12);
      }

      .entry-layout {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 0.9fr) minmax(420px, 1.1fr);
        align-items: start;
      }

      .entry-copy {
        padding-top: 12px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--text-faint);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .entry-copy h1 {
        margin: 0;
        font-family: "Baskerville", "Times New Roman", "Songti SC", "Source Han Serif SC", serif;
        font-size: clamp(40px, 5vw, 76px);
        line-height: 1.02;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .entry-copy p {
        max-width: 24rem;
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.65;
        text-wrap: pretty;
      }

      .entry-form {
        position: relative;
        display: grid;
        gap: 16px;
        padding: 20px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(18, 24, 39, 0.96), rgba(12, 16, 27, 0.98));
        box-shadow: var(--shadow-1);
      }

      .entry-form::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.03);
        pointer-events: none;
      }

      .form-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      .form-head h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .form-head p {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--text-faint);
      }

      .field-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field,
      .field-wide {
        display: grid;
        gap: 8px;
      }

      .field-wide {
        grid-column: 1 / -1;
      }

      .field label,
      .field-wide label {
        font-size: 13px;
        color: var(--text-faint);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field input,
      .field textarea,
      .field-wide input,
      .field-wide textarea {
        width: 100%;
        padding: 14px 15px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
        outline: none;
        transition:
          border-color 160ms var(--ease),
          box-shadow 160ms var(--ease),
          transform 160ms var(--ease);
      }

      .field textarea,
      .field-wide textarea {
        min-height: 104px;
        resize: vertical;
      }

      .field input::placeholder,
      .field textarea::placeholder,
      .field-wide input::placeholder,
      .field-wide textarea::placeholder {
        color: rgba(139, 151, 189, 0.52);
      }

      .field input:focus,
      .field textarea:focus,
      .field-wide input:focus,
      .field-wide textarea:focus {
        border-color: var(--line-strong);
        box-shadow: 0 0 0 4px rgba(76, 117, 220, 0.16);
      }

      .field-note {
        margin: -2px 0 0;
        font-size: 13px;
        line-height: 1.6;
      }

      .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding-top: 6px;
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 16px;
        border: 1px solid transparent;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 150ms var(--ease),
          border-color 160ms var(--ease),
          background-color 160ms var(--ease),
          box-shadow 160ms var(--ease),
          color 160ms var(--ease);
      }

      .pill-btn.primary {
        color: rgba(245, 248, 255, 0.98);
        background:
          radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.18), transparent 40%),
          linear-gradient(145deg, rgba(77, 118, 232, 0.98), rgba(36, 76, 179, 0.98));
        box-shadow: 0 18px 34px rgba(28, 58, 141, 0.34);
      }

      .pill-btn.secondary {
        color: var(--text-soft);
        border-color: var(--line);
        background: rgba(18, 25, 38, 0.82);
      }

      .pill-btn:active {
        transform: scale(0.96);
      }

      .pill-btn:focus-visible,
      .field input:focus-visible,
      .field textarea:focus-visible,
      .field-wide input:focus-visible,
      .field-wide textarea:focus-visible {
        outline: 2px solid rgba(124, 167, 255, 0.78);
        outline-offset: 2px;
      }

      .status-line {
        min-height: 22px;
        font-size: 13px;
        color: var(--text-faint);
      }

      .status-line.is-error {
        color: rgba(255, 167, 167, 0.9);
      }

      .entry-footer {
        display: none;
      }

      @media (max-width: 960px) {
        .entry-card {
          padding: 22px;
        }

        .entry-layout {
          grid-template-columns: 1fr;
        }

        .entry-copy {
          padding-top: 0;
        }
      }

      @media (max-width: 720px) {
        .entry-topbar,
        .form-head,
        .action-row {
          align-items: flex-start;
          flex-direction: column;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }

        .entry-copy h1 {
          font-size: 42px;
        }

        .entry-form {
          padding: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body data-page="intake">
    <main class="entry-shell">
      <section class="entry-card">
        <div class="entry-topbar">
          <div class="brand">
            <div class="brand-mark">玄</div>
            <div class="brand-copy">
              <strong>Analysis Intake</strong>
              <span>录入后进入解析舱</span>
            </div>
          </div>
          <div class="signal-strip" aria-hidden="true">
            <span class="signal-dot"></span>
            <span>录入后跳转</span>
          </div>
        </div>

        <div class="entry-layout">
          <div class="entry-copy">
            <p class="eyebrow">Intake</p>
            <h1>录入。</h1>
            <p>只保留输入。</p>
          </div>

          <form class="entry-form" id="intake-form">
            <div class="form-head">
              <div>
                <h2>八字</h2>
                <p>完整度决定未决项。</p>
              </div>
            </div>

            <div class="field-grid">
              <div class="field-wide">
                <label for="field-query">问题</label>
                <textarea
                  id="field-query"
                  name="query"
                  placeholder="例如：事业与感情"
                  required
                ></textarea>
              </div>

              <div class="field">
                <label for="field-name">姓名</label>
                <input id="field-name" name="name" type="text" placeholder="可选" />
              </div>

              <div class="field">
                <label for="field-timezone">时区</label>
                <input id="field-timezone" name="timezone" type="text" placeholder="Asia/Shanghai" />
              </div>

              <div class="field">
                <label for="field-date">出生日期</label>
                <input id="field-date" name="birth_date" type="date" />
              </div>

              <div class="field">
                <label for="field-time">出生时辰</label>
                <input id="field-time" name="birth_time" type="time" />
              </div>

              <div class="field-wide">
                <label for="field-place">出生地</label>
                <input id="field-place" name="birth_place" type="text" placeholder="例如：南京" />
              </div>
            </div>

            <p class="field-note">提交后跳转。</p>

            <div class="action-row">
              <div class="button-row">
                <button class="pill-btn primary" type="submit">进入</button>
                <button class="pill-btn secondary" type="button" id="load-demo">样例</button>
              </div>
              <div class="status-line" id="status-line"></div>
            </div>
          </form>
        </div>

      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
